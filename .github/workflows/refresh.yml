# Weekly refresh of the Levelling Up Fund delivery tracker.
#
# Re-runs the classification agent over every project, rebuilds the dashboard
# data file, and commits any changes back to the repo. GitHub Pages / Netlify /
# Vercel then redeploy automatically on that commit.
#
# The geocode and describe stages are intentionally NOT run here: a project's
# location and original remit are static and already committed, so the weekly
# job only needs to refresh delivery *status* (the thing that actually changes).
#
# CI cannot use a local AWS SSO session, so this workflow uses the Anthropic
# backend. Add two repository secrets (Settings -> Secrets and variables ->
# Actions): ANTHROPIC_API_KEY and TAVILY_API_KEY.

name: Weekly delivery refresh

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to commit the refreshed data back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-run classification and rebuild dashboard data
        env:
          LLM_BACKEND: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -m pipeline.run
          python -m pipeline.build_dashboard

      - name: Commit refreshed data (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.csv docs/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly delivery-status refresh"
            git push
          fi
